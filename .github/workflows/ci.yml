name: il bootstrap gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: il-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build pinned bootstrap environment
        run: docker build --platform linux/amd64 --file tools/Dockerfile --tag il-bootstrap:ci .
      - name: Run gates and reconstruct external Git binding
        run: >-
          docker run --rm --platform linux/amd64
          --volume "$GITHUB_WORKSPACE:/workspace"
          --env CI=true
          il-bootstrap:ci python3 tools/ci/run.py
      - name: Preserve machine-readable gate results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bootstrap-linux-x86_64-${{ github.sha }}
          path: |
            build/ci/
            build/*_report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
